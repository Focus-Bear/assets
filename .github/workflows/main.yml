name: Check Config JSON file keys

on:
  push:
    paths:
      - 'config/**/*.json'
      - '.github/workflows/main.yml'
      - '.github/workflows/check-json.sh'
      - '.github/workflows/check-config-json.py'
  pull_request:
    paths:
      - 'config/**/*.json'
      - '.github/workflows/main.yml'
      - '.github/workflows/check-json.sh'
      - '.github/workflows/check-config-json.py'

jobs:
  check-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check config JSON (valid, no duplicate keys, missing translations)
        run: bash ./.github/workflows/check-json.sh
