name: Block page tests

on:
  push:
    paths:
      - 'focus-blocked/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/block-page-tests.yml'
  pull_request:
    paths:
      - 'focus-blocked/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/block-page-tests.yml'

jobs:
  test-blocked-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run block page tests
        run: npm run test:blocked-page
